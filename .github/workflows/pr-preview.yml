name: PR Preview

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write        # 机器人发评论
  pull-requests: write

# 同一 PR 的打包串行执行，避免并发重复打包
concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pack:
    # fork PR 也触发（给别人玩），但不做任何写仓库操作
    runs-on: ubuntu-latest
    steps:
      # 获取 PR 号：pull_request 事件直接用；issue_comment 事件从 issue 拿（PR 评论的 issue 号 = PR 号）
      - name: Resolve PR number
        id: pr
        shell: pwsh
        run: |
          $prNo = "${{ github.event.pull_request.number || github.event.issue.number }}"
          echo "prNo=$prNo" >> $env:GITHUB_OUTPUT
          Write-Host "PR 号: $prNo"

      # 获取该 PR 的最新 head 提交 sha（对方分支要打包的提交）
      - name: Resolve PR head sha
        id: sha
        uses: actions/github-script@v7
        with:
          script: |
            const prNo = "${{ steps.pr.outputs.prNo }}";
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNo,
            });
            const headSha = pr.head.sha;
            const sha7 = headSha.slice(0, 7);
            core.setOutput('headSha', headSha);
            core.setOutput('sha7', sha7);
            console.log(`head=${headSha} sha7=${sha7}`);

      # 评论命令校验：@github-actions[bot] pack <sha7>
      # sha7 必须是本 PR 的 head 提交（防复制：别的 PR 的 sha7 对不上）
      - name: Check repack command
        id: check
        if: github.event_name == 'issue_comment'
        shell: pwsh
        run: |
          $body = "${{ github.event.comment.body }}"
          $sha7 = "${{ steps.sha.outputs.sha7 }}"
          $pattern = "@github-actions\[bot\]\s+pack\s+$sha7\b"
          if ($body -match $pattern) {
            echo "triggered=true" >> $env:GITHUB_OUTPUT
            Write-Host "✅ 命中: $($Matches[0])（sha7 匹配本 PR head）"
          } else {
            echo "triggered=false" >> $env:GITHUB_OUTPUT
            Write-Host "⏭️ 未命中（需: @github-actions[bot] pack $sha7，sha7 必须是本 PR 的提交）"
          }

      # 产物名: 0.0.0-pr.{PR号}.{sha7}
      - name: Compute label
        id: version
        shell: pwsh
        run: |
          $prNo = "${{ steps.pr.outputs.prNo }}"
          $sha7 = "${{ steps.sha.outputs.sha7 }}"
          $label = "0.0.0-pr.${prNo}.${sha7}"
          echo "label=$label" >> $env:GITHUB_OUTPUT
          Write-Host "产物名: $label"

      # 打包（PR opened 或评论命中时）
      - name: Pack PR version
        if: github.event_name == 'pull_request' || steps.check.outputs.triggered == 'true'
        shell: pwsh
        run: |
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
          </Project>
          "@ | Out-File -Encoding utf8 tmp.csproj
          dotnet pack tmp.csproj -p:NuspecFile=$(Resolve-Path DotNetTemplate.nuspec) -p:Version="${{ steps.version.outputs.label }}" -o out
          Remove-Item tmp.csproj -ErrorAction SilentlyContinue

      # 上传 artifact（同名会被覆盖——sha7 相同说明同一提交，产物一样）
      - name: Upload PR artifact
        if: github.event_name == 'pull_request' || steps.check.outputs.triggered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.label }}
          path: out/*.nupkg
          if-no-files-found: error

      # PR opened 时发初始说明评论（含命令说明）
      - name: Comment on PR opened
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const runId = context.runId;
            const label = "${{ steps.version.outputs.label }}";
            const sha7 = "${{ steps.sha.outputs.sha7 }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `✅ 已打包预发布版 **${label}**`,
                ``,
                `📦 产物见 Actions artifact：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
                ``,
                `---`,
                `**命令 / Commands**`,
                ``,
                `重新打包 / Repack：回复 \`@github-actions[bot] pack ${sha7}\`（sha7 是本 PR 的提交，复制到别的 PR 无效）`,
                ``,
                `发版 / Release：给本 PR 挂 \`vX.Y.Z\` 里程碑并合并，自动打 \`vX.Y.Z-build.N\` 并发布草稿 Release。`,
                `Add a \`vX.Y.Z\` milestone and merge to auto release.`,
              ].join('\n'),
            });

      # 评论重打包后回复
      - name: Reply on comment
        if: steps.check.outputs.triggered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNo = context.payload.issue.number;
            const label = "${{ steps.version.outputs.label }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNo,
              body: `✅ 已重新打包 **${label}**，见最新 Actions artifact。`,
            });
