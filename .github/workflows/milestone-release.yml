name: Release from Milestone Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write    # 打 tag / 建 Release
  issues: write      # 发评论

jobs:
  release:
    # 仅自己仓库 PR 合并（fork PR 的 GITHUB_TOKEN 只读，打不了 tag）
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要全部 tag 来数 build

      # 读里程碑名并校验：必须 vX.Y.Z（纯数字三段，不能带预览/元数据）
      - name: Resolve milestone version
        id: milestone
        shell: pwsh
        run: |
          $milestone = "${{ github.event.pull_request.milestone.title }}"
          Write-Host "里程碑: $milestone"
          if (-not $milestone) {
            Write-Host "⏭️ 无里程碑，跳过发版"
            echo "valid=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($milestone -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "❌ 里程碑不是 vX.Y.Z 格式: $milestone（不允许预览版/元数据）"
            echo "valid=false" >> $env:GITHUB_OUTPUT
            echo "msg=里程碑必须是 vX.Y.Z（如 v0.2.0），不能带 -pre/+meta" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $ver = $milestone -replace '^v', ''
          echo "valid=true" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "✅ 版本前缀: $ver"

      # 里程碑不合法：评论提示（不阻止合并，仅说明）
      - name: Comment invalid milestone
        if: steps.milestone.outputs.valid == 'false' && steps.milestone.outputs.msg != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const msg = "${{ steps.milestone.outputs.msg }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `⚠️ ${msg}，未自动发版。`,
            });

      # 数 v{版本}-build.* 现有 tag，取最大 +1
      - name: Compute build number
        id: build
        if: steps.milestone.outputs.valid == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.milestone.outputs.ver }}"
          $existing = git tag -l "v${ver}-build.*"
          $max = -1
          foreach ($t in $existing) {
            if ($t -match "^v${ver}-build\.(\d+)$") {
              $n = [int]$Matches[1]
              if ($n -gt $max) { $max = $n }
            }
          }
          $build = $max + 1
          echo "build=$build" >> $env:GITHUB_OUTPUT
          echo "full=$ver-build.$build" >> $env:GITHUB_OUTPUT
          Write-Host "✅ 版本: $ver-build.$build（已有 $($existing.Count) 个）"

      - name: Pack
        if: steps.milestone.outputs.valid == 'true'
        shell: pwsh
        run: |
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
          </Project>
          "@ | Out-File -Encoding utf8 tmp.csproj
          dotnet pack tmp.csproj -p:NuspecFile=$(Resolve-Path DotNetTemplate.nuspec) -p:Version="${{ steps.build.outputs.full }}" -o out
          Remove-Item tmp.csproj -ErrorAction SilentlyContinue

      # 建 draft Release（tag 由 action 自动创建）
      - name: Create draft release
        if: steps.milestone.outputs.valid == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.full }}
          files: out/*.nupkg
          draft: true
          generate_release_notes: true
